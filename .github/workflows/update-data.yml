name: Mise à jour des données ETF

on:
  schedule:
    # 2, 3 et 4 du mois à 06:17 UTC : le mois précédent est clos et publié.
    # Les passages suivants ne commitent rien si rien n'a changé.
    - cron: "17 6 2,3,4 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data      # évite deux exécutions simultanées qui se disputeraient le push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # s'arrête proprement si une source reste bloquée
    env:
      PYTHONUNBUFFERED: "1"      # affiche la progression en direct dans les journaux
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # facultatif : clé FRED (Settings → Secrets → Actions)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Télécharger et construire les séries
        id: fetch
        continue-on-error: true
        run: python fetch_data.py

      - name: Recalculer les backtests
        run: python run_backtests.py

      - name: Committer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add data/ results/ site/
          git diff --cached --quiet || git commit -m "Données ETF $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

      - name: Signaler un échec
        if: steps.fetch.outcome == 'failure'
        run: |
          cat data/quality_report.md
          echo "::error::Au moins un ETF en erreur, voir data/quality_report.md"
          exit 1
